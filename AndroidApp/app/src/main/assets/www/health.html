<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NutriSmart AI - Health Based Recommendation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;

            background:
                linear-gradient(rgba(0, 0, 0, 0.60), rgba(0, 0, 0, 0.60)),
                url('./images/futures.jpg');

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            min-height: 100vh;
        }

        /* ================= HEADER ================= */

        .header {
            background: linear-gradient(360deg, black, #f9a941);
            color: white;
            padding: 40px 20px;
            text-align: center;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
        }

        .logo-title {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .logo-title h1 {
            font-size: 55px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 165, 0, 0.6);
        }

        .header-logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        .header p {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            color: #f5f5f5;
        }

        /* ================= FORM ================= */

        .form-section {
            margin-top: 50px;
        }

        .form-card {

            background: rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            padding: 40px;

            border-radius: 30px;

            border: 1px solid rgba(255, 255, 255, 0.2);

            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* ================= LABELS ================= */

        .form-label {
            color: black;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 15px;
        }

        /* ================= INPUTS ================= */

        .form-control,
        .form-select {

            height: 55px;

            border-radius: 15px;

            background: rgba(255, 255, 255, 0.15);

            border: 1px solid black;

            color: black;

            backdrop-filter: blur(8px);

            padding-left: 15px;

            font-weight: 500;

            box-shadow: none;
        }

        .form-control:focus,
        .form-select:focus {

            border: 1px solid black;

            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);

            background: rgba(255, 255, 255, 0.18);

            color: black;
        }

        /* ================= PLACEHOLDER ================= */

        .form-control::placeholder {
            color: #333;
        }

        /* ================= DROPDOWN ================= */

        .form-select {

            height: 55px;

            border-radius: 15px;

            background: transparent;

            border: 1px solid black;

            color: black;

            font-weight: bold;

            padding-left: 15px;

            backdrop-filter: blur(8px);

            appearance: none;

            -webkit-appearance: none;

            -moz-appearance: none;

            cursor: pointer;
        }

        .form-select:focus {


            box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);

            background: rgba(255, 255, 255, 0.18);

            color: black;
        }

        /* DROPDOWN OPTIONS */

        .form-select option {

            background: #ffffff;

            color: #ff5722;

            font-weight: bold;
        }

        /* ================= BUTTON ================= */

        .generate-btn {

            background: linear-gradient(135deg, #ff8c42, #ff5722);

            color: white;

            border: none;

            padding: 15px;

            border-radius: 15px;

            width: 100%;

            font-size: 18px;

            font-weight: bold;

            transition: 0.4s;

            box-shadow: 0 8px 20px rgba(255, 87, 34, 0.4);
        }

        .generate-btn:hover {

            transform: translateY(-3px);

            background: linear-gradient(135deg, #ff5722, #ff8c42);
        }

        /* ================= RECIPES ================= */

        .recipe-section {
            margin-top: 60px;
        }

        .recipe-card {

            background: rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 25px;

            overflow: hidden;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);

            transition: 0.4s;

            height: 100%;
        }

        .recipe-card:hover {

            transform: translateY(-8px) scale(1.02);
        }

        /* ================= IMAGE ================= */

        .recipe-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        /* ================= RECIPE CONTENT ================= */

        .recipe-content {
            padding: 22px;
            color: black;
        }

        /* ================= RECIPE TITLE ================= */

        .recipe-title {

            font-size: 28px;

            font-weight: bold;

            color: #ffb347;

            margin-bottom: 10px;
        }

        /* ================= RECIPE SUBTITLE ================= */

        .recipe-subtitle {

            font-weight: bold;

            margin-top: 18px;

            color: #ff9f43;

            font-size: 18px;
        }

        /* ================= LISTS ================= */

        .recipe-content ul,
        .recipe-content ol {
            padding-left: 20px;
        }

        .recipe-content li {
            margin-bottom: 8px;
            line-height: 1.6;
        }

        /* ================= TABLE ================= */

        .table {

            margin-top: 10px;

            color: black;

            border-color: rgba(0, 0, 0, 0.2);
        }

        .table th {
            color: #ffb347;
        }

        /* ================= BADGE ================= */

        .badge-custom {

            background: linear-gradient(135deg, #ff8c42, #ff5722);

            padding: 8px 16px;

            border-radius: 30px;

            color: white;

            font-size: 13px;

            font-weight: bold;
        }

        /* ================= LOADER ================= */

        .loader {
            display: none;
            color: white;
            text-align: center;
            margin-top: 30px;
        }

        .spinner-border {
            width: 4rem;
            height: 4rem;
            color: #ff9f43;
        }

        /* ================= RESPONSIVE ================= */

        @media(max-width:768px) {

            .header-logo {
                width: 100px;
                height: 100px;
            }

            .logo-title h1 {
                font-size: 35px;
            }

            .form-card {
                padding: 25px;
            }

            .recipe-title {
                font-size: 24px;
            }

        }

        /* ================= NOTIFICATION SYSTEM ================= */

        .notification-card,
        .feedback-card {

            background: rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(15px);

            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 25px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);

        }

        .notification-card .form-control {

            color: black;

        }

        .notification-card .form-control::-webkit-calendar-picker-indicator {

            filter: none;

        }
    
@media (max-width: 768px) {
    .dashboard {
        grid-template-columns: 1fr !important;
        margin-left: 0 !important;
    }
    .panel {
        margin-right: 0 !important;
        margin-bottom: 20px !important;
    }
    .modal-content {
        width: 95% !important;
        padding: 15px !important;
    
    min-height: 50vh;
    display: flex;
    flex-direction: column;
    .container {
        padding: 10px !important;
    }
}


    @media(max-width:768px) {
        .navbar {
            flex-direction: column !important;
            align-items: center !important;
            padding: 15px 10px !important;
        }
        .navbar .d-flex.gap-3 {
            width: 100% !important;
            overflow-x: auto !important;
            white-space: nowrap !important;
            justify-content: flex-start !important;
            padding-bottom: 5px !important;
        }
        .nav-link-custom {
            white-space: nowrap !important;
            flex-shrink: 0 !important;
        }
        .navbar > div:first-child {
            display: flex !important;
            justify-content: center !important;
            width: 100% !important;
        }
    }
    
</style>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <div class="header">
        <div class="logo-title">

            <img src="./images/logo.png" class="header-logo">
        </div>
        <p>Personalized Health Based Diet Recommendation System</p>
    </div>

    <!-- ================= FORM ================= -->

    <div class="container form-section">

        <div class="form-card">

            <div class="row g-4">

                <div class="col-md-6">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" id="name">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Age</label>
                    <input type="number" class="form-control" id="age">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Gender</label>
                    <select class="form-select" id="gender">

                        <option value="">Select Gender</option>

                        <option value="Male">Male</option>

                        <option value="Female">Female</option>

                        <option value="Other">Other</option>

                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Height (cm)</label>
                    <input type="number" class="form-control" id="height">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Weight (kg)</label>
                    <input type="number" class="form-control" id="weight">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Food Type</label>
                    <select class="form-select" id="foodType">

                        <option value="">Select Food Type</option>

                        <option value="Veg">Veg</option>

                        <option value="Non-Veg">Non-Veg</option>

                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Health Condition</label>
                    <input type="text" class="form-control" id="condition" placeholder="Diabetes, BP, stomach pain...">
                </div>

                <div class="col-12">
                    <button class="generate-btn" onclick="generateRecipes()">
                        Generate AI Diet Recommendations
                    </button>
                </div>

            </div>

        </div>
        <div id="alertBox"></div>
        <!-- ================= LOADER ================= -->

        <div class="loader" id="loader">
            <div class="spinner-border text-success"></div>
            <h4 class="mt-3">AI Generating Healthy Recipes...</h4>
        </div>
        

    <!-- ================= NOTIFICATION & FEEDBACK SYSTEM ================= -->

    <div id="notificationSection" class="notification-card mt-4 p-4" style="display:none;">

        <h3 class="text-dark">🔔 NutriSmart Notifications</h3>

        <p class="text-dark">
            Your meal plan is ready. Allow notifications only if you want meal reminders.
        </p>

        <div class="d-flex gap-2 flex-wrap align-items-center mb-3">

            <button class="btn btn-warning" onclick="requestNotificationPermission()">
                🔔 Allow Notifications
            </button>

            <button class="btn btn-outline-dark" onclick="disableNotifications()">
                Disable Notifications
            </button>

            <span id="notificationStatus" class="text-dark">
                Notifications are not enabled
            </span>

        </div>

        <div id="notificationSettings" style="display:none;">

            <h5 class="text-dark mt-3">⏰ Set Your Preferred Meal Times</h5>

            <div class="row g-3">

                <div class="col-md-3">
                    <label class="form-label">Breakfast</label>
                    <input type="time" id="breakfastTime" class="form-control" value="08:00">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Lunch</label>
                    <input type="time" id="lunchTime" class="form-control" value="13:00">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Evening Snack</label>
                    <input type="time" id="snackTime" class="form-control" value="17:00">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Dinner</label>
                    <input type="time" id="dinnerTime" class="form-control" value="20:00">
                </div>

            </div>

            <button id="saveNotificationBtn" class="btn btn-success mt-3" onclick="saveNotificationSettings()">
                Save Notification Times
            </button>

        </div>

        <div id="feedbackBox" class="feedback-card mt-4 p-4" style="display:none;">

            <h3 class="text-dark">📊 Meal Feedback</h3>

            <p id="feedbackMeal" class="text-dark"></p>

            <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-success" onclick="submitFeedback('completed')">
                    ✅ I Ate This Meal
                </button>

                <button class="btn btn-danger" onclick="submitFeedback('skipped')">
                    ❌ I Skipped This Meal
                </button>

                <button class="btn btn-warning" onclick="submitFeedback('different')">
                    🍽️ Ate Something Different
                </button>
            </div>

        </div>

    </div>
        <!-- ================= RECIPES OUTPUT ================= -->

        <div class="recipe-section">
            <div class="row g-4" id="recipeContainer"></div>
        </div>
    </div>


<!-- ================= SCRIPT ================= -->

<script src="./js/api_config.js"></script>

<!-- Centralized Managers -->
<script src="./js/plan-manager.js"></script>
<script src="./js/notification-manager.js"></script>
<script src="./js/feedback-manager.js"></script>
<script src="./js/analytics-manager.js"></script>

<script>
let currentFeedbackMeal = "";
let notificationTimers = [];

/* ================= STORAGE KEYS ================= */

const SETTINGS_KEY = "nutriSmartNotificationSettings";
const PLAN_KEY = "nutriSmartCurrentPlan";
const FEEDBACK_KEY = "nutriSmartFeedback";
const NOTIFICATION_ENABLED_KEY =
    "nutriSmartNotificationsEnabled";


/* =====================================================
   GENERATE AI RECIPES
===================================================== */

async function generateRecipes() {

    /*
       IMPORTANT:
       This function is called only when the user
       wants to generate a NEW AI plan.

       Therefore, old plan and old notification
       settings are cleared here.
    */

    removeCurrentPlanAndNotifications();


    /* ================= GET USER DETAILS ================= */

    const name =
        document.getElementById("name").value;

    const age =
        document.getElementById("age").value;

    const gender =
        document.getElementById("gender").value;

    const height =
        document.getElementById("height").value;

    const weight =
        document.getElementById("weight").value;

    const foodType =
        document.getElementById("foodType").value;

    const condition =
        document.getElementById("condition").value;


    /* ================= VALIDATION ================= */

    if (

        name.trim() === "" ||
        age.trim() === "" ||
        gender.trim() === "" ||
        height.trim() === "" ||
        weight.trim() === "" ||
        foodType.trim() === "" ||
        condition.trim() === ""

    ) {

        document.getElementById(
            "alertBox"
        ).innerHTML = `

        <div class="alert alert-danger mt-4 text-center">

            Please fill all the details before generating recipes.

        </div>

        `;


        setTimeout(() => {

            document.getElementById(
                "alertBox"
            ).innerHTML = "";

        }, 3000);


        return;

    }


    /* ================= SHOW LOADER ================= */

    document.getElementById(
        "loader"
    ).style.display = "block";


    document.getElementById(
        "recipeContainer"
    ).innerHTML = "";


    try {


        /* ================= API REQUEST ================= */

        const response = await apiFetch(

            "/generate-health-recipes",

            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    name,
                    age,
                    gender,
                    height,
                    weight,
                    foodType,
                    condition

                })

            }

        );


        const recipes =
            await response.json();


        console.log(
            "Generated Recipes:",
            recipes
        );


        if (

            !Array.isArray(recipes)

        ) {

            alert(
                "AI failed to generate recipes."
            );

            return;

        }


        /* ================= DISPLAY RECIPES ================= */

        await displayRecipes(
            recipes
        );

        try {
            await apiFetch("/api/save_plan?plan_type=health", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(recipes)
            });
        } catch(e) { console.error("Failed to save plan to backend", e); }



        /* ================= SAVE NEW PLAN ================= */

        localStorage.setItem(

            PLAN_KEY,

            JSON.stringify(
                recipes
            )

        );


        /*
           Notification section appears
           ONLY AFTER recipes are generated.
        */

        showNotificationSection();


        /*
           Notifications are NOT automatically scheduled
           unless user has already allowed them.

           Since a new plan resets notification status,
           the user must click Allow Notifications again.
        */

        scheduleMealNotifications();


    }


    catch (error) {


        console.log(
            "Recipe Generation Error:",
            error
        );


        alert(
            "Error generating recipes."
        );


    }


    finally {


        document.getElementById(
            "loader"
        ).style.display = "none";


    }

}


/* =====================================================
   DISPLAY RECIPES
===================================================== */

async function displayRecipes(
    recipes
) {


    const container =
        document.getElementById(
            "recipeContainer"
        );


    container.innerHTML = "";


    for (

        let recipe of recipes

    ) {


                /* ================= AUTHENTIC RECIPE IMAGE ================= */

        // Use the real recipe image from the dataset if available, otherwise fallback to default
        let imageUrl = recipe.image && recipe.image.includes("http") ? 
            recipe.image : 
            "https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg";


/* ================= INGREDIENTS ================= */

        let ingredientsHTML =
            "";


        if (

            Array.isArray(
                recipe.ingredients
            )

        ) {


            recipe.ingredients.forEach(

                item => {


                    ingredientsHTML += `

                    <li>
                        ${item}
                    </li>

                    `;

                }

            );

        }


        /* ================= PROCESS ================= */

        let processHTML =
            "";


        if (

            Array.isArray(
                recipe.process
            )

        ) {


            recipe.process.forEach(

                step => {


                    processHTML += `

                    <li>
                        ${step}
                    </li>

                    `;

                }

            );

        }


        /* ================= APPEND RECIPE CARD ================= */

        container.innerHTML += `

        <div class="col-lg-4">

            <div class="recipe-card">

                <img
                    src="${imageUrl}"
                    class="recipe-img"
                >

                <div class="recipe-content">

                    <div class="recipe-title">

                        ${recipe.name}

                    </div>


                    <div class="mt-2">

                        <span
                            class="badge-custom"
                        >

                            Healthy AI Recommendation

                        </span>

                    </div>


                    <div class="recipe-subtitle">

                        Ingredients

                    </div>


                    <ul>

                        ${ingredientsHTML}

                    </ul>


                    <div class="recipe-subtitle">

                        Cooking Process

                    </div>


                    <ol>

                        ${processHTML}

                    </ol>


                    <div class="recipe-subtitle">

                        Nutrition

                    </div>


                    <table
                        class="table table-bordered"
                    >

                        <tr>

                            <th>
                                Calories
                            </th>

                            <td>

                                ${recipe.nutrition?.calories || "N/A"}

                            </td>

                        </tr>


                        <tr>

                            <th>
                                Protein
                            </th>

                            <td>

                                ${recipe.nutrition?.protein || "N/A"}

                            </td>

                        </tr>


                        <tr>

                            <th>
                                Carbs
                            </th>

                            <td>

                                ${recipe.nutrition?.carbs || "N/A"}

                            </td>

                        </tr>


                        <tr>

                            <th>
                                Fat
                            </th>

                            <td>

                                ${recipe.nutrition?.fat || "N/A"}

                            </td>

                        </tr>

                    </table>

                </div>

            </div>

        </div>

        `;

    }

}


/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(

    "DOMContentLoaded",

    async function () {


        /*
           Restore old plan when user comes back
           or refreshes the page.
        */

        const savedPlan =
            localStorage.getItem(
                PLAN_KEY
            );


        if (

            savedPlan

        ) {


            try {


                const recipes =
                    JSON.parse(
                        savedPlan
                    );


                await displayRecipes(
                    recipes
                );

        try {
            await apiFetch("/api/save_plan?plan_type=health", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(recipes)
            });
        } catch(e) { console.error("Failed to save plan to backend", e); }



                /*
                   Show notification section
                   because an active plan exists.
                */

                showNotificationSection();


            }


            catch (error) {


                console.log(
                    "Error restoring saved plan:",
                    error
                );


            }

        }


        /*
           Restore saved meal times.
        */

        loadNotificationSettings();


        /*
           Update notification status.
        */

        updateNotificationStatus();


        /*
           If notifications were previously enabled,
           schedule them again after page reload.
        */

        scheduleMealNotifications();


    }

);


/* =====================================================
   SHOW NOTIFICATION SECTION
===================================================== */

function showNotificationSection() {


    const section =
        document.getElementById(
            "notificationSection"
        );


    if (

        !section

    ) {

        return;

    }


    section.style.display =
        "block";


    const enabled =
        localStorage.getItem(
            NOTIFICATION_ENABLED_KEY
        ) === "true";


    const settings =
        document.getElementById(
            "notificationSettings"
        );


    if (

        settings

    ) {


        settings.style.display =
            enabled
            ? "block"
            : "none";

    }

}


/* =====================================================
   REQUEST NOTIFICATION PERMISSION
===================================================== */

async function requestNotificationPermission() {


    if (

        !("Notification" in window)

    ) {


        alert(

            "This browser does not support notifications."

        );


        return false;

    }


    const permission =
        await Notification.requestPermission();


    if (

        permission === "granted"

    ) {


        localStorage.setItem(

            NOTIFICATION_ENABLED_KEY,

            "true"

        );


        const settings =
            document.getElementById(
                "notificationSettings"
            );


        if (

            settings

        ) {


            settings.style.display =
                "block";

        }


        updateNotificationStatus();


        scheduleMealNotifications();


        return true;

    }


    /*
       Browser permission denied.
    */

    localStorage.setItem(

        NOTIFICATION_ENABLED_KEY,

        "false"

    );


    const settings =
        document.getElementById(
            "notificationSettings"
        );


    if (

        settings

    ) {


        settings.style.display =
            "none";

    }


    updateNotificationStatus();


    return false;

}


/* =====================================================
   DISABLE NOTIFICATIONS
===================================================== */

function disableNotifications() {


    /*
       IMPORTANT:

       DO NOT DELETE PLAN_KEY.

       The recipes must remain saved.
    */


    /* Stop all active timers */

    clearAllNotificationTimers();


    /* Disable application notification status */

    localStorage.setItem(

        NOTIFICATION_ENABLED_KEY,

        "false"

    );


    /* Clear saved meal times */

    localStorage.removeItem(

        SETTINGS_KEY

    );


    /* Reset input values */

    document.getElementById(
        "breakfastTime"
    ).value = "08:00";


    document.getElementById(
        "lunchTime"
    ).value = "13:00";


    document.getElementById(
        "snackTime"
    ).value = "17:00";


    document.getElementById(
        "dinnerTime"
    ).value = "20:00";


    /* Hide time settings */

    const settings =
        document.getElementById(
            "notificationSettings"
        );


    if (

        settings

    ) {


        settings.style.display =
            "none";

    }


    updateNotificationStatus();


    alert(

        "🔕 Notifications disabled. Your recipes are still saved."

    );

}


/* =====================================================
   UPDATE NOTIFICATION STATUS
===================================================== */

function updateNotificationStatus() {


    const status =
        document.getElementById(
            "notificationStatus"
        );


    if (

        !status

    ) {

        return;

    }


    const enabled =
        localStorage.getItem(

            NOTIFICATION_ENABLED_KEY

        ) === "true";


    if (

        enabled &&

        "Notification" in window &&

        Notification.permission === "granted"

    ) {


        status.innerHTML =
            "✅ Notifications Allowed";


    }


    else {


        status.innerHTML =
            "❌ Notifications Disabled";

    }

}


/* =====================================================
   SAVE NOTIFICATION TIMES
===================================================== */

function saveNotificationSettings() {


    const enabled =
        localStorage.getItem(

            NOTIFICATION_ENABLED_KEY

        ) === "true";


    if (

        !enabled

    ) {


        alert(

            "Please allow notifications first."

        );


        return;

    }


    const settings = {


        breakfast:

            document.getElementById(

                "breakfastTime"

            ).value,


        lunch:

            document.getElementById(

                "lunchTime"

            ).value,


        snack:

            document.getElementById(

                "snackTime"

            ).value,


        dinner:

            document.getElementById(

                "dinnerTime"

            ).value


    };


    localStorage.setItem(

        SETTINGS_KEY,

        JSON.stringify(

            settings

        )

    );


    clearAllNotificationTimers();


    scheduleMealNotifications();


    alert(

        "✅ Notification times saved successfully!"

    );

}


/* =====================================================
   LOAD NOTIFICATION TIMES
===================================================== */

function loadNotificationSettings() {


    const saved =
        localStorage.getItem(

            SETTINGS_KEY

        );


    if (

        !saved

    ) {

        return;

    }


    try {


        const settings =
            JSON.parse(

                saved

            );


        if (

            settings.breakfast

        ) {


            document.getElementById(

                "breakfastTime"

            ).value =

                settings.breakfast;

        }


        if (

            settings.lunch

        ) {


            document.getElementById(

                "lunchTime"

            ).value =

                settings.lunch;

        }


        if (

            settings.snack

        ) {


            document.getElementById(

                "snackTime"

            ).value =

                settings.snack;

        }


        if (

            settings.dinner

        ) {


            document.getElementById(

                "dinnerTime"

            ).value =

                settings.dinner;

        }


    }


    catch (error) {


        console.log(

            "Settings Load Error:",

            error

        );

    }

}


/* =====================================================
   CLEAR OLD PLAN ONLY WHEN GENERATING NEW PLAN
===================================================== */

function removeCurrentPlanAndNotifications() {


    /*
       Stop notifications for the old plan.
    */

    clearAllNotificationTimers();


    /*
       Delete old recipes.

       This happens ONLY when the user clicks
       Generate AI Recipes again.
    */

    localStorage.removeItem(

        PLAN_KEY

    );


    /*
       Delete old notification times.
    */

    localStorage.removeItem(

        SETTINGS_KEY

    );


    /*
       Reset notification status for the new plan.
    */

    localStorage.removeItem(

        NOTIFICATION_ENABLED_KEY

    );


    /*
       Reset input time values.
    */

    document.getElementById(
        "breakfastTime"
    ).value = "08:00";


    document.getElementById(
        "lunchTime"
    ).value = "13:00";


    document.getElementById(
        "snackTime"
    ).value = "17:00";


    document.getElementById(
        "dinnerTime"
    ).value = "20:00";


    /*
       Hide notification time settings.
    */

    const settings =
        document.getElementById(
            "notificationSettings"
        );


    if (

        settings

    ) {


        settings.style.display =
            "none";

    }


}


/* =====================================================
   CLEAR ALL NOTIFICATION TIMERS
===================================================== */

function clearAllNotificationTimers() {


    notificationTimers.forEach(

        timer => {


            clearTimeout(

                timer

            );

        }

    );


    notificationTimers = [];

}


/* =====================================================
   SCHEDULE MEAL NOTIFICATIONS
===================================================== */

function scheduleMealNotifications() {


    const enabled =
        localStorage.getItem(

            NOTIFICATION_ENABLED_KEY

        ) === "true";


    if (

        !enabled ||

        !("Notification" in window) ||

        Notification.permission !== "granted"

    ) {


        return;

    }


    /*
       Do not schedule if no recipe plan exists.
    */

    const currentPlan =
        localStorage.getItem(

            PLAN_KEY

        );


    if (

        !currentPlan

    ) {


        return;

    }


    const savedSettings =
        localStorage.getItem(

            SETTINGS_KEY

        );


    if (

        !savedSettings

    ) {


        return;

    }


    const settings =
        JSON.parse(

            savedSettings

        );


    const meals = [


        {

            name: "Breakfast",

            time: settings.breakfast

        },


        {

            name: "Lunch",

            time: settings.lunch

        },


        {

            name: "Evening Snack",

            time: settings.snack

        },


        {

            name: "Dinner",

            time: settings.dinner

        }


    ];


    meals.forEach(

        meal => {


            if (

                meal.time

            ) {


                scheduleNextMealNotification(

                    meal

                );

            }

        }

    );

}


/* =====================================================
   SCHEDULE NEXT MEAL
===================================================== */

function scheduleNextMealNotification(

    meal

) {


    const now =
        new Date();


    const [

        hours,

        minutes

    ] =

        meal.time.split(

            ":"

        );


    const notificationTime =
        new Date();


    notificationTime.setHours(

        Number(

            hours

        ),

        Number(

            minutes

        ),

        0,

        0

    );


    /*
       If today's time has passed,
       schedule for tomorrow.
    */

    if (

        notificationTime <= now

    ) {


        notificationTime.setDate(

            notificationTime.getDate() + 1

        );

    }


    const delay =

        notificationTime.getTime()

        -

        now.getTime();


    const timer =

        setTimeout(

            () => {


                sendMealNotification(

                    meal.name

                );


                /*
                   Feedback after one hour.
                */

                const feedbackTimer =

                    setTimeout(

                        () => {


                            showFeedbackNotification(

                                meal.name

                            );


                        },

                        60 *

                        60 *

                        1000

                    );


                notificationTimers.push(

                    feedbackTimer

                );


                /*
                   Schedule same meal for tomorrow.
                */

                scheduleNextMealNotification(

                    meal

                );


            },

            delay

        );


    notificationTimers.push(

        timer

    );

}


/* =====================================================
   SEND MEAL NOTIFICATION
===================================================== */

function sendMealNotification(

    mealName

) {


    if (

        Notification.permission !==

        "granted"

    ) {


        return;

    }


    new Notification(

        "🍽️ NutriSmart Meal Reminder",

        {


            body:

                `It is time for your ${mealName}.`


        }

    );

}


/* =====================================================
   FEEDBACK NOTIFICATION
===================================================== */

function showFeedbackNotification(

    mealName

) {


    if (

        Notification.permission ===

        "granted"

    ) {


        new Notification(

            "📊 NutriSmart Feedback",

            {


                body:

                    `How was your ${mealName}?`


            }

        );

    }


    showFeedbackBox(

        mealName

    );

}


/* =====================================================
   SHOW FEEDBACK BOX
===================================================== */

function showFeedbackBox(

    mealName

) {


    currentFeedbackMeal =
        mealName;


    const box =
        document.getElementById(

            "feedbackBox"

        );


    const mealText =
        document.getElementById(

            "feedbackMeal"

        );


    if (

        !box ||

        !mealText

    ) {


        return;

    }


    box.style.display =
        "block";


    mealText.innerHTML =

        `How was your ${mealName}?`;

}


/* =====================================================
   SUBMIT FEEDBACK
===================================================== */

function submitFeedback(

    status

) {


    const feedback = {


        meal:

            currentFeedbackMeal,


        status:

            status,


        date:

            new Date().toISOString()


    };


    const feedbackList =

        JSON.parse(

            localStorage.getItem(

                FEEDBACK_KEY

            ) ||

            "[]"

        );


    feedbackList.push(

        feedback

    );


    localStorage.setItem(

        FEEDBACK_KEY,

        JSON.stringify(

            feedbackList

        )

    );


    const box =
        document.getElementById(

            "feedbackBox"

        );


    if (

        box

    ) {


        box.style.display =
            "none";

    }


    alert(

        "✅ Feedback saved successfully!"

    );

}



// ==========================================
// OVERRIDDEN BY CENTRAL MANAGER
// ==========================================

async function requestNotificationPermission() {
    const settings = document.getElementById("notificationSettings");
    if (settings) {
        settings.style.display = "block";
    }

    const status = document.getElementById("notificationStatus");
    if (status) {
        status.innerText = "Notifications Enabled ✅";
        status.style.color = "green";
    }

    const planObj = window.planManager.getActivePlan();
    if (!planObj || planObj.planType !== "health") {
        alert("Please generate a new plan or confirm the plan switch first.");
        return;
    }
    planObj.notificationsEnabled = true;
    
    const times = {
        breakfast: document.getElementById('breakfastTime')?.value || "08:00",
        lunch: document.getElementById('lunchTime')?.value || "13:00",
        evening: document.getElementById('snackTime')?.value || "17:00",
        dinner: document.getElementById('dinnerTime')?.value || "20:00"
    };
    planObj.notificationTimes = times;
    
    await window.planManager.activatePlan(planObj);
}

async function disableNotifications() {
    await window.planManager.disableActivePlan();
    
    // Clear the active recipes and hide notifications per user request
    const recipeContainer = document.getElementById("recipeContainer");
    if (recipeContainer) recipeContainer.innerHTML = "";
    
    const notificationSection = document.getElementById("notificationSection");
    if (notificationSection) notificationSection.style.display = "none";
    
    const feedbackBox = document.getElementById("feedbackBox");
    if (feedbackBox) feedbackBox.style.display = "none";
    
    // Also remove from local storage so it doesn't reload
    localStorage.removeItem(PLAN_KEY);
}

async function saveNotificationSettings() {
    await requestNotificationPermission();
}

async function scheduleMealNotifications() {
    const keys = ["currentPlan", "nutriSmartCurrentPlan", "LOSS_PLAN_KEY", "WEIGHT_GAIN_PLAN_KEY", "GYM_PLAN_KEY", "MEAL_PLAN_KEY", "BUDGET_PLAN_KEY"];
    let planData = null;
    for(let k of keys) {
        const d = localStorage.getItem(k);
        if(d) {
            try { planData = JSON.parse(d); break; } catch(e) {}
        }
    }
    
    const newPlanData = {
        notificationTimes: {
            breakfast: document.getElementById('breakfastTime')?.value || "08:00",
            lunch: document.getElementById('lunchTime')?.value || "13:00",
            evening: document.getElementById('snackTime')?.value || "17:00",
            dinner: document.getElementById('dinnerTime')?.value || "20:00"
        },
        planData: planData
    };
    
    const success = await window.planManager.requestPlanSwitch("health", newPlanData);
    if (!success) {
        alert("The generated plan is visible, but notifications remain attached to your previously active plan.");
    }
}

// Alias for pages that use scheduleNotifications instead of scheduleMealNotifications
async function scheduleNotifications() {
    await scheduleMealNotifications();
}

<script>
document.addEventListener("DOMContentLoaded", () => {
    const overrideBtn = (id, html, bg, displaySettings, callback) => {
        const btn = document.getElementById(id);
        if (btn) {
            // Remove existing listeners by cloning
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            newBtn.addEventListener("click", async () => {
                const settings = document.getElementById("notificationSettings");
                if(settings) settings.style.display = displaySettings;
                if(html) newBtn.innerHTML = html;
                if(bg) newBtn.style.background = bg;
                if(callback) await callback();
            });
        }
    };
    
    overrideBtn("allowNotificationBtn", "✅ Notifications Enabled", "#28a745", "block", async () => {
        if(typeof scheduleMealNotifications === 'function') await scheduleMealNotifications();
        else if(typeof scheduleNotifications === 'function') await scheduleNotifications();
    });
    
    overrideBtn("allowBtn", "✅ Notifications Enabled", "#28a745", "block", async () => {
        if(typeof scheduleMealNotifications === 'function') await scheduleMealNotifications();
        else if(typeof scheduleNotifications === 'function') await scheduleNotifications();
    });
    
    overrideBtn("disableNotificationBtn", "🔔 Disable Notifications", "#f5a623", "none", async () => {
        if(typeof disableNotifications === 'function') await disableNotifications();
        // Reset fields
        document.querySelectorAll('input:not([id*="Time"]), select, textarea').forEach(el => el.value = "");
    });
    
    overrideBtn("disableBtn", "🔔 Disable Notifications", "#f5a623", "none", async () => {
        if(typeof disableNotifications === 'function') await disableNotifications();
        document.querySelectorAll('input:not([id*="Time"]), select, textarea').forEach(el => el.value = "");
    });
    
    overrideBtn("saveNotificationBtn", null, null, "block", async () => {
        if(typeof saveNotificationSettings === 'function') await saveNotificationSettings();
        alert("✅ Meal notification times saved successfully!");
    });
    
    overrideBtn("saveBtn", null, null, "block", async () => {
        if(typeof saveNotificationSettings === 'function') await saveNotificationSettings();
        alert("✅ Meal notification times saved successfully!");
    });
});
</script>
