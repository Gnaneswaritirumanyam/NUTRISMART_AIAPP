name: "Security Review - SAST, Dependency & Secret Scanning"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ─────────────────────────────────────────
  # JOB 1 — Technology Detection
  # ─────────────────────────────────────────
  detect-stack:
    name: "Detect Technology Stack"
    runs-on: ubuntu-latest
    outputs:
      is_python: ${{ steps.detect.outputs.is_python }}
      is_node: ${{ steps.detect.outputs.is_node }}
      framework: ${{ steps.detect.outputs.framework }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect backend technology
        id: detect
        run: |
          IS_PYTHON=false
          IS_NODE=false
          FRAMEWORK="unknown"

          if ls backend/*.py 2>/dev/null || ls *.py 2>/dev/null; then
            IS_PYTHON=true
            if grep -q "from fastapi" backend/main.py 2>/dev/null; then
              FRAMEWORK="fastapi"
            elif grep -q "from flask" backend/main.py 2>/dev/null; then
              FRAMEWORK="flask"
            else
              FRAMEWORK="python-generic"
            fi
          fi

          if [ -f "package.json" ] || [ -f "backend/package.json" ]; then
            IS_NODE=true
            if grep -q "express" package.json 2>/dev/null; then FRAMEWORK="express"; fi
          fi

          echo "is_python=$IS_PYTHON" >> $GITHUB_OUTPUT
          echo "is_node=$IS_NODE" >> $GITHUB_OUTPUT
          echo "framework=$FRAMEWORK" >> $GITHUB_OUTPUT

          echo "### Stack Detection" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Python | $IS_PYTHON |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js | $IS_NODE |" >> $GITHUB_STEP_SUMMARY
          echo "| Framework | $FRAMEWORK |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────
  # JOB 2 — Gitleaks Secret Scanning
  # ─────────────────────────────────────────
  gitleaks:
    name: "Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          if-no-files-found: ignore

  # ─────────────────────────────────────────
  # JOB 3 — Semgrep SAST
  # ─────────────────────────────────────────
  semgrep:
    name: "SAST Scan (Semgrep)"
    runs-on: ubuntu-latest
    needs: detect-stack
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST (Auto mode)
        run: |
          mkdir -p security-reports
          semgrep scan \
            --config=auto \
            --sarif \
            --output=security-reports/semgrep.sarif \
            --timeout=300 \
            . || true

      - name: Run Semgrep OWASP Top 10
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --json \
            --output=security-reports/semgrep-owasp.json \
            --timeout=300 \
            . || true

      - name: Run Semgrep Python Security
        if: needs.detect-stack.outputs.is_python == 'true'
        run: |
          semgrep scan \
            --config=p/python \
            --json \
            --output=security-reports/semgrep-python.json \
            --timeout=300 \
            . || true

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: security-reports/semgrep.sarif
        continue-on-error: true

      - name: Upload Semgrep Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-reports
          path: security-reports/

      - name: Summarize Semgrep
        if: always()
        run: |
          echo "### Semgrep SAST Results" >> $GITHUB_STEP_SUMMARY
          if [ -f security-reports/semgrep-owasp.json ]; then
            COUNT=$(python3 -c "import json; d=json.load(open('security-reports/semgrep-owasp.json')); print(len(d.get('results', [])))" 2>/dev/null || echo "N/A")
            echo "| OWASP Top 10 Findings | $COUNT |" >> $GITHUB_STEP_SUMMARY
          fi

  # ─────────────────────────────────────────
  # JOB 4 — Trivy Dependency & FS Scan
  # ─────────────────────────────────────────
  trivy:
    name: "Dependency Scan (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy (CRITICAL/HIGH — gate)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-critical.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
        continue-on-error: true

      - name: Run Trivy (full table report)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          output: "trivy-full.txt"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
        continue-on-error: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-critical.sarif"
        continue-on-error: true

      - name: Upload Trivy Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-critical.sarif
            trivy-full.txt
          if-no-files-found: ignore

  # ─────────────────────────────────────────
  # JOB 5 — pip-audit (Python CVE Scan)
  # ─────────────────────────────────────────
  pip-audit:
    name: "Python CVE Audit (pip-audit)"
    runs-on: ubuntu-latest
    needs: detect-stack
    if: needs.detect-stack.outputs.is_python == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Prepare requirements.txt
        run: |
          if [ ! -f requirements.txt ] && [ -f backend/requirement.txt ]; then
            cp backend/requirement.txt requirements.txt
          fi
          # Ensure it's proper pip format, not import statements
          if grep -q "^from\|^import" requirements.txt 2>/dev/null; then
            echo "fastapi" > requirements.txt
            echo "uvicorn" >> requirements.txt
            echo "pymongo" >> requirements.txt
            echo "passlib[bcrypt]" >> requirements.txt
            echo "python-jose[cryptography]" >> requirements.txt
            echo "python-dotenv" >> requirements.txt
            echo "pydantic[email]" >> requirements.txt
            echo "httpx" >> requirements.txt
            echo "openai" >> requirements.txt
            echo "google-auth" >> requirements.txt
            echo "Pillow" >> requirements.txt
            echo "requests" >> requirements.txt
          fi

      - name: Run pip-audit
        run: |
          mkdir -p security-reports
          pip-audit -r requirements.txt --format=json \
            --output=security-reports/pip-audit.json || true

      - name: Upload pip-audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: security-reports/pip-audit.json
          if-no-files-found: ignore

  # ─────────────────────────────────────────
  # JOB 6 — Consolidated Report & Summary
  # ─────────────────────────────────────────
  report:
    name: "Generate Security Report"
    runs-on: ubuntu-latest
    needs: [semgrep, trivy, gitleaks, pip-audit]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports
        continue-on-error: true

      - name: Generate Summary
        run: |
          echo "# NutriSmart AI — Security Review Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Job Result | Purpose |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ${{ needs.gitleaks.result }} | Secret / credential leakage detection |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep | ${{ needs.semgrep.result }} | Static Application Security Testing (SAST) |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy | ${{ needs.trivy.result }} | Dependency CVE scanning |" >> $GITHUB_STEP_SUMMARY
          echo "| pip-audit | ${{ needs.pip-audit.result }} | Python package vulnerability audit |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> All detailed reports are available as downloadable Artifacts on this Actions run." >> $GITHUB_STEP_SUMMARY

      - name: Upload consolidated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-security-reports
          path: all-reports/
          if-no-files-found: ignore

  # ─────────────────────────────────────────
  # JOB 7 — Quality Gate (Fail on Critical)
  # ─────────────────────────────────────────
  quality-gate:
    name: "Quality Gate (Critical Findings)"
    runs-on: ubuntu-latest
    needs: [trivy, semgrep]
    if: always()
    steps:
      - name: Evaluate Quality Gate
        run: |
          TRIVY="${{ needs.trivy.result }}"
          echo "Trivy: $TRIVY"
          echo "Semgrep: ${{ needs.semgrep.result }}"

          if [ "$TRIVY" = "failure" ]; then
            echo "BLOCKED: Critical/High severity vulnerabilities detected by Trivy."
            echo "Please review the Trivy report and remediate all CRITICAL findings before merging."
            exit 1
          fi

          echo "Quality gate PASSED. No critical blocking vulnerabilities."
