name: Web Deploy and E2E Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  deploy-and-test:
    name: Deploy to GitHub Pages and Run Selenium E2E
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Add your specific build steps here
      # - name: Install Dependencies
      #   run: npm ci
      # - name: Build Application
      #   run: npm run build

      # Assuming the build output is in 'dist' directory
      # This step requires setting up GitHub Pages branch (gh-pages)
      # - name: Deploy to GitHub Pages
      #   uses: peaceiris/actions-gh-pages@v3
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: ./dist

      - name: Wait for Deployment
        run: sleep 30 # Adjust based on deployment time

      - name: Setup Python for Selenium
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Selenium Framework Dependencies
        run: |
          pip install -r web-automation/requirements.txt
          playwright install chromium # if using playwright or setup webdriver for selenium

      - name: Run Selenium E2E Tests
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          echo "Running tests against: $BASE_URL"
          pytest web-automation/tests/ --html=reports/execution-report.html --self-contained-html

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-reports
          path: |
            reports/
            screenshots/
            logs/
          retention-days: 30
