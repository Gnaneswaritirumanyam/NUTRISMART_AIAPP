name: Full Automated Test Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  selenium_web_tests:
    name: Selenium Web E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install and Run Selenium Tests
        working-directory: ./selenium-tests
        run: |
          npm install
          node tests/login-tests.js || true
      - name: Upload Selenium Test Report
        uses: actions/upload-artifact@v4
        with:
          name: 'Selenium - Web E2E Test Report'
          path: selenium-tests/Test_Report_305_Styled.xlsx

  appium_mobile_tests:
    name: Appium Mobile E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install and Run Appium Tests
        working-directory: ./appium-tests
        run: |
          npm install
          node app-tests.js || true
      - name: Upload Appium Test Report
        uses: actions/upload-artifact@v4
        with:
          name: 'Appium - Mobile E2E Test Report'
          path: appium-tests/Appium_Test_Report_305_Styled.xlsx

  security_scans:
    name: Automated Security Scans (SAST & Dependency)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Run Semgrep Code Scan (SAST)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config auto || true
      - name: Run Trivy Vulnerability Scanner (Dependencies)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace aquasec/trivy fs . --exit-code 0 --no-progress || true

  load_tests:
    name: Load Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Load Test Placeholder
        run: echo "Add your load test scripts here to complete the 4-test suite."
