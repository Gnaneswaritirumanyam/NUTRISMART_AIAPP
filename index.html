<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- For CSS -->
  <link rel="stylesheet" href="./styles.css">

  <style>
    body,
    html {
      height: 100%;
      margin: 0;
    }

    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .glass-form {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: saturate(180%) blur(10px);
      -webkit-backdrop-filter: saturate(180%) blur(10px);
      padding: 3rem;
      border-radius: 15px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.2);
    }

    .form-control {
      margin-bottom: 1rem;
      font-size: 1.05rem;
      /* Larger input text */
      padding: 0.75rem 1rem;
    }

    .text-danger {
      font-size: 0.85rem;
    }

    /* Button styling */
    .btn-primary {
      background-color: #ff5722;
      border-color: #ff5722;
      font-size: 1.1rem;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
    }

    .btn-primary:hover {
      background-color: #e64a19;
      border-color: #e64a19;
    }

    @media (max-width: 576px) {
      .glass-form {
        padding: 1.5rem;
        width: 95%;
      }

      .form-control {
        font-size: 1rem;
        padding: 0.5rem;
      }

      h2.mb-4 {
        font-size: 1.5rem;
      }
    }

    @media (max-width: 768px) {
      .dashboard {
        grid-template-columns: 1fr !important;
        margin-left: 0 !important;
      }

      .panel {
        margin-right: 0 !important;
        margin-bottom: 20px !important;
      }

      .modal-content {
        width: 95% !important;
        padding: 15px !important;
      }

      .container {
        padding: 10px !important;
      }
    }
  </style>

  <!-- Google reCAPTCHA -->
  <script src="./js/api_config.js"></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

  <video autoplay muted loop playsinline class="bg-video">
    <source src="./recipes_images/video.mp4" type="video/mp4">
  </video>

  <div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="glass-form">
      <h2 class="mb-4">Create Account</h2>
      <form id="signupForm" novalidate>

        <!-- Google Auth -->
        <div id="g_id_onload" data-client_id="786266517047-fjn0bnf02v7li2ovkn2m5vrvn5fgsapl.apps.googleusercontent.com"
          data-context="signup" data-ux_mode="popup" data-callback="handleGoogleLogin" data-auto_prompt="false">
        </div>
        <!-- Web Google Button -->
        <div class="g_id_signin" id="webGoogleBtn" data-type="standard" data-shape="rectangular" data-theme="outline"
          data-text="continue_with" data-size="large" data-logo_alignment="left"
          style="display: flex; justify-content: center; margin-bottom: 15px;">
        </div>

        <!-- Native Google Button (Hidden on Web) -->
        <button type="button" id="nativeGoogleBtn" class="btn btn-outline-dark w-100"
          style="display: none; margin-bottom: 15px; font-weight: 500;">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="20" height="20"
            style="margin-right: 10px;">
          Continue with Google
        </button>
        <div style="display: flex; align-items: center; text-align: center; margin-bottom: 15px;">
          <hr style="flex: 1; border-top: 1px solid #ccc;">
          <span style="padding: 0 10px; color: #666; font-size: 14px;">OR</span>
          <hr style="flex: 1; border-top: 1px solid #ccc;">
        </div>

        <div class="mb-2">
          <input type="text" id="name" class="form-control" placeholder="Full Name" required>
          <div class="text-danger" id="nameError"></div>
        </div>

        <div class="mb-2">
          <input type="email" id="email" class="form-control" placeholder="name@gmail.com" required>
          <div class="text-danger" id="emailError"></div>
        </div>

        <div class="mb-2">
          <input type="password" id="password" class="form-control" placeholder="Password" required>
          <div class="text-danger" id="passwordError"></div>
        </div>

        <div class="mb-2">
          <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" required>
          <div class="text-danger" id="confirmPasswordError"></div>
        </div>

        <div class="g-recaptcha mb-3" data-sitekey="6LcNtNgrAAAAANv10NpJp7oMHJM83SAxCOGQ_2kT"></div>
        <div class="text-danger" id="recaptchaError"></div>

        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
        <p class="text-center mt-3 mb-0 small">Already have an account?
          <a href="./login.html" style="color:#e64a19;">Log in</a>
        </p>
      </form>

      <form id="otpForm" style="display: none;" novalidate>
        <div class="mb-3">
          <p>A verification code has been sent to your email.</p>
          <input type="text" id="otpCode" class="form-control" placeholder="6-digit OTP" required maxlength="6">
          <div class="text-danger" id="otpError"></div>
        </div>
        <button type="submit" id="verifyOtpBtn" class="btn btn-primary w-100 mb-2">Verify OTP</button>
        <button type="button" id="resendOtpBtn" class="btn btn-secondary w-100">Resend OTP <span
            id="resendTimer"></span></button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,}$/;
    const emailRegex = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;

    // Native Google Auth setup
    document.addEventListener('DOMContentLoaded', () => {
      if (window.Capacitor && window.Capacitor.isNativePlatform()) {
        try {
          Capacitor.Plugins.GoogleAuth.initialize({
            clientId: '786266517047-fjn0bnf02v7li2ovkn2m5vrvn5fgsapl.apps.googleusercontent.com',
            scopes: ['profile', 'email']
          });
        } catch (e) {
          console.error("Failed to initialize GoogleAuth", e);
        }
        document.getElementById('webGoogleBtn').style.display = 'none';
        document.getElementById('nativeGoogleBtn').style.display = 'block';

        document.getElementById('nativeGoogleBtn').addEventListener('click', async () => {
          try {
            const user = await Capacitor.Plugins.GoogleAuth.signIn();
            const res = await apiFetch('/api/auth/google', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ credential: user.authentication.idToken })
            });
            const data = await res.json();
            if (res.ok) {
              localStorage.setItem("user_name", data.name);
              if (data.access_token) {
                localStorage.setItem("access_token", data.access_token);
              }
              window.location.href = "./intro.html";
            } else {
              alert(data.detail || 'Google Login failed');
            }
          } catch (err) {
            console.error("Native Google Login error:", err);
            alert("Signup Error: " + (err.message || JSON.stringify(err)));
          }
        });
      }
    });


    async function handleGoogleLogin(response) {
      try {
        const res = await apiFetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem("user_name", data.name);
          if (data.access_token) {
            localStorage.setItem("access_token", data.access_token);
          }
          window.location.href = "./intro.html";
        } else {
          alert(data.detail || 'Google Login failed');
        }
      } catch (err) {
        console.error("Google Login error:", err);
        alert('Server error. Try again later.');
      }
    }

    let userEmail = "";

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Clear previous errors
      ['nameError', 'emailError', 'passwordError', 'confirmPasswordError', 'recaptchaError'].forEach(id => {
        document.getElementById(id).innerText = '';
      });

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();
      const recaptcha = grecaptcha.getResponse();

      let hasError = false;

      if (!name) { document.getElementById('nameError').innerText = 'Please enter your name'; hasError = true; }
      if (!emailRegex.test(email)) { document.getElementById('emailError').innerText = 'Please enter a valid Gmail'; hasError = true; }
      if (!passwordRegex.test(password)) { document.getElementById('passwordError').innerText = 'Password must include uppercase, lowercase, number, symbol & 8+ chars'; hasError = true; }
      if (password !== confirmPassword) { document.getElementById('confirmPasswordError').innerText = 'Passwords do not match'; hasError = true; }
      if (!recaptcha) { document.getElementById('recaptchaError').innerText = 'Please complete the reCAPTCHA'; hasError = true; }

      if (hasError) return;

      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;

      try {
        const response = await apiFetch("/api/auth/signup/request-otp", {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, confirmPassword, recaptchaToken: recaptcha })
        });

        const data = await response.json();
        if (response.ok) {
          userEmail = email;
          document.getElementById('signupForm').style.display = 'none';
          document.getElementById('otpForm').style.display = 'block';
          startResendCooldown(60);
        } else {
          alert(data.detail || 'Signup failed');
        }
      } catch (err) {
        alert('Server error. Try again later.');
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('otpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('otpError').innerText = '';
      const otp = document.getElementById('otpCode').value.trim();
      if (!otp) {
        document.getElementById('otpError').innerText = 'Please enter OTP';
        return;
      }

      const btn = document.getElementById('verifyOtpBtn');
      btn.disabled = true;
      try {
        const response = await apiFetch("/api/auth/signup/verify-otp", {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail, otp })
        });
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem("user_name", data.name);
          if (data.access_token) {
            localStorage.setItem("access_token", data.access_token);
          }
          alert('Signup successful!');
          window.location.href = "./intro.html";
        } else {
          document.getElementById('otpError').innerText = data.detail || 'Invalid OTP';
        }
      } catch (err) {
        alert('Server error.');
      } finally {
        btn.disabled = false;
      }
    });

    let cooldownTimer;
    function startResendCooldown(seconds) {
      const btn = document.getElementById('resendOtpBtn');
      const timerSpan = document.getElementById('resendTimer');
      btn.disabled = true;
      let time = seconds;

      clearInterval(cooldownTimer);
      cooldownTimer = setInterval(() => {
        time--;
        if (time <= 0) {
          clearInterval(cooldownTimer);
          timerSpan.innerText = '';
          btn.disabled = false;
        } else {
          timerSpan.innerText = `(${time}s)`;
        }
      }, 1000);
    }

    document.getElementById('resendOtpBtn').addEventListener('click', async () => {
      const btn = document.getElementById('resendOtpBtn');
      btn.disabled = true;
      try {
        const response = await apiFetch("/api/auth/signup/resend-otp", {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: userEmail })
        });
        const data = await response.json();
        if (response.ok) {
          alert('A new OTP has been sent.');
          startResendCooldown(60);
        } else {
          alert(data.detail || 'Failed to resend OTP');
          btn.disabled = false;
        }
      } catch (err) {
        alert('Server error');
        btn.disabled = false;
      }
    });
    <!-- For JS -->

  </script>
  <script src="./script.js"></script>
</body>

</html>
