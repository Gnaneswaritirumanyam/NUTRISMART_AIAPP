<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>NutriSmart AI Weekly Food Planner</title>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
        to right,
        #f38043,
        #ffffff,
        #f38043
    );

}


/* ================= LAYOUT ================= */

.dashboard{

    display:flex;

    min-height:100vh;

}


/* ================= LEFT PANEL ================= */

.left-panel{

    width:30%;

    background:white;

    padding:25px;

    box-shadow:
    2px 0 10px
    rgba(0,0,0,0.1);

    overflow-y:auto;

}


.header{

    text-align:center;

    margin-bottom:25px;

}


.logo{

    width:120px;

    height:120px;

    object-fit:contain;

}


.title{

    font-size:22px;

    font-weight:bold;

    color:#ff6b00;

}


.input-group{

    margin-bottom:15px;

}


label{

    font-weight:bold;

    font-size:13px;

    color:#444;

}


input,
select,
textarea{

    width:100%;

    padding:11px;

    border-radius:10px;

    border:1px solid #ddd;

    margin-top:5px;

}


textarea{

    resize:vertical;

}


.btn{

    width:100%;

    padding:13px;

    border:none;

    border-radius:10px;

    background:#ff6b00;

    color:white;

    font-weight:bold;

    cursor:pointer;

    margin-top:10px;

}


.btn:hover{

    background:#e85d00;

}


/* ================= RIGHT PANEL ================= */

.right-panel{

    width:70%;

    padding:30px;

    overflow-y:auto;

}


.week-grid{

    display:grid;

    grid-template-columns:
    repeat(
        auto-fit,
        minmax(100px,1fr)
    );

    gap:12px;

}


.day-card{

    background:white;

    padding:18px;

    border-radius:12px;

    text-align:center;

    font-weight:bold;

    color:#ff6b00;

    cursor:pointer;

    box-shadow:
    0 4px 10px
    rgba(0,0,0,0.08);

    transition:0.3s;

}


.day-card:hover{

    background:#ff6b00;

    color:white;

    transform:translateY(-3px);

}


/* ================= DAY VIEW ================= */

.day-view{

    margin-top:25px;

    background:white;

    padding:25px;

    border-radius:15px;

    display:none;

}


.meal{

    background:#fff7f0;

    padding:18px;

    border-radius:12px;

    margin-bottom:15px;

}


.meal-title{

    font-weight:bold;

    color:#ff6b00;

    font-size:17px;

    margin-bottom:8px;

}


.calories{

    color:#555;

    font-size:14px;

    margin-top:8px;

}


/* ================= NOTIFICATION CARD ================= */

.notification-card{

    background:white;

    margin-top:25px;

    padding:25px;

    border-radius:15px;

    box-shadow:
    0 4px 15px
    rgba(0,0,0,0.1);

}


.notification-card h3{

    color:#ff6b00;

    margin-top:0;

}


.notification-card label{

    display:block;

    margin-top:12px;

}


.notification-card input[type="time"]{

    width:100%;

    padding:10px;

}


#notificationSettings{

    display:none;

}


#notificationStatus{

    font-weight:bold;

    margin-top:15px;

}


.notification-btn{

    width:100%;

    padding:12px;

    border:none;

    border-radius:10px;

    color:white;

    font-weight:bold;

    cursor:pointer;

    margin-top:10px;

}


.allow-btn{

    background:#ff6b00;

}


.disable-btn{

    background:#dc3545;

}


.save-btn{

    background:#198754;

}

.recipe-btn{

    margin-top:12px;

    padding:10px 15px;

    border:none;

    border-radius:8px;

    background:#198754;

    color:white;

    font-weight:bold;

    cursor:pointer;

}

.recipe-btn:hover{

    background:#146c43;

}

.recipe-box{

    margin-top:20px;

    padding:20px;

    background:#f0fff5;

    border-radius:15px;

    border-left:5px solid #198754;

}

.recipe-box h3{

    color:#198754;

}

.recipe-box h4{

    color:#ff6b00;

}

.recipe-box li{

    margin-bottom:8px;

}
/* ================= RESPONSIVE ================= */

@media(max-width:900px){

    .dashboard{

        flex-direction:column;

    }


    .left-panel,
    .right-panel{

        width:100%;

    }


    .left-panel{

        min-height:auto;

    }

}
.recipe-modal {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.6);

    justify-content: center;

    align-items: center;

    z-index: 9999;
}


.recipe-modal-content {

    background: white;

    width: 90%;

    max-width: 650px;

    max-height: 85vh;

    overflow-y: auto;

    padding: 30px;

    border-radius: 20px;

    position: relative;
}


.close-recipe {

    position: absolute;

    right: 15px;

    top: 15px;

    border: none;

    background: #dc3545;

    color: white;

    border-radius: 50%;

    width: 32px;

    height: 32px;

    cursor: pointer;
}


.recipe-btn {

    margin-top: 12px;

    padding: 10px 15px;

    border: none;

    border-radius: 8px;

    background: #ff6b00;

    color: white;

    cursor: pointer;

    font-weight: bold;
}


.recipe-btn:hover {

    background: #e85d00;
}

@media (max-width: 768px) {
    .dashboard {
        grid-template-columns: 1fr !important;
        margin-left: 0 !important;
    }
    .panel {
        margin-right: 0 !important;
        margin-bottom: 20px !important;
    }
    .modal-content {
        width: 95% !important;
        padding: 15px !important;
    }
    .container {
        padding: 10px !important;
    }
}


    @media(max-width:768px) {
        .navbar {
            flex-direction: column !important;
            align-items: center !important;
            padding: 15px 10px !important;
        }
        .navbar .d-flex.gap-3 {
            width: 100% !important;
            overflow-x: auto !important;
            white-space: nowrap !important;
            justify-content: flex-start !important;
            padding-bottom: 5px !important;
        }
        .nav-link-custom {
            white-space: nowrap !important;
            flex-shrink: 0 !important;
        }
        .navbar > div:first-child {
            display: flex !important;
            justify-content: center !important;
            width: 100% !important;
        }
    }
    
</style>

</head>


<body>


<div class="dashboard">


<!-- =====================================================
     LEFT USER DETAILS
===================================================== -->

<div class="left-panel">


<div class="header">

<img
    src="./images/logo.png"
    class="logo"
    alt="NutriSmart Logo"
>

<div class="title">

🍛 NutriSmart AI Food Planner

</div>

</div>


<div class="input-group">

>

</div>


<div class="input-group">

<div class="input-group">

<option value="">Select Gender</option>

<option>Male</option>

<option>Female</option>

</select>

</div>


<div class="input-group">

<label>Height (cm)</label>

<input
    type="number"
    id="height"

<div class="input-group">

<label>Current Weight (kg)</label>

<input
    type="number"

>

<div class="input-group">

<input

<!-- =====================================================

===================================================== -->

<div

>


<h3>

🔔 Meal Notifications

</h3>


<p>

Receive reminders for your planned meals.

</p>


<button

    id="allowNotificationBtn"
>

🔔 Allow Notifications

</button>

>

>

💾 Save Notification Times

</button>


</div>


</div>


</div>


<!-- =====================================================
     RIGHT WEEKLY PLAN
===================================================== -->

<div class="right-panel">


<h2
    style="color:#ff6b00;"
>

📅 Your AI Weekly Food Plan

</h2>


<div
    class="week-grid"
    id="weekGrid"
>

<p>

Loading plan...

</p>

</div>


<div
    class="day-view"
    id="dayView"
>

</div>


</div>


</div>
<div id="recipeModal" class="recipe-modal">

    <div class="recipe-modal-content">

        <button
            class="close-recipe"
            onclick="closeRecipe()"
        >
            ✖
        </button>

        <div id="recipeContent">

            <p>Recipe will appear here...</p>

        </div>

    </div>

</div>
<script src="./js/api_config.js"></script>

<!-- Centralized Managers -->
<script src="./js/plan-manager.js"></script>
<script src="./js/notification-manager.js"></script>
<script src="./js/feedback-manager.js"></script>
<script src="./js/analytics-manager.js"></script>

<script>
let currentUserEmail = "";
let plan = {};

const SETTINGS_KEY = "nutriSmartNotificationSettings";
const NOTIFICATION_ENABLED_KEY = "nutriSmartNotificationsEnabled";

let notificationTimers = [];


// ======================================================
// LOAD SESSION
// ======================================================

async function loadSession() {

    try {

        const res = await apiFetch("/api/session", {
            credentials: "include"
        });

        const session = await res.json();

        if (!session.active) {

            alert("Please login first");

            window.location.href = "./login.html";

            return;
        }

        currentUserEmail = session.email;

        await loadExistingPlan();

        loadNotificationSettings();

        updateNotificationStatus();

        if (
            localStorage.getItem(NOTIFICATION_ENABLED_KEY) === "true" &&
            "Notification" in window &&
            Notification.permission === "granted"
        ) {

            scheduleMealNotifications();
        }

    } catch (error) {

        console.error("Session Error:", error);
    }
}


// ======================================================
// LOAD EXISTING PLAN
// ======================================================

async function loadExistingPlan() {

    try {

        const res = await apiFetch(
            `/get-weekly-food-plan?email=${encodeURIComponent(currentUserEmail)}`,
            {
                credentials: "include"
            }
        );

        if (!res.ok) {

            throw new Error("Failed to load plan");
        }

        const data = await res.json();

        if (data.plan) {

            plan = data.plan;

            localStorage.setItem(
                "currentPlan",
                JSON.stringify(plan)
            );

            loadWeek();

            console.log("Saved AI plan loaded");

        } else {

            console.log("No saved plan found");
        }

    } catch (error) {

        console.error("Plan loading error:", error);
    }
}


// ======================================================
// GET USER DATA
// ======================================================

function getUserData() {

    return {

        email: currentUserEmail,

        name: document.getElementById("name").value.trim(),

        age: document.getElementById("age").value.trim(),

        gender: document.getElementById("gender").value.trim(),

        height: document.getElementById("height").value.trim(),

        weight: document.getElementById("weight").value.trim(),

        targetWeight:
            document.getElementById("targetWeight").value.trim(),

        activityLevel:
            document.getElementById("activityLevel").value.trim(),

        goal: document.getElementById("goal").value.trim(),

        foodType:
            document.getElementById("foodType").value.trim(),

        healthIssues:
            document.getElementById("healthIssues").value.trim()
    };
}


// ======================================================
// GENERATE AI PLAN
// ======================================================

async function generatePlan(regenerate = false) {

    const userData = getUserData();

    if (
        !userData.name ||
        !userData.age ||
        !userData.gender ||
        !userData.weight ||
        !userData.foodType ||
        !userData.goal
    ) {

        alert("Please fill all required details");

        return;
    }

    const button =
        document.getElementById("generateBtn");

    button.innerText =
        "🤖 Generating AI Plan...";

    button.disabled = true;

    userData.regenerate = regenerate;

    try {

        const res = await apiFetch(
            "/generate-weekly-food-plan",
            {

                method: "POST",

                credentials: "include",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(userData)
            }
        );

        const data = await res.json();

        if (!res.ok || !data.plan) {

            throw new Error(
                data.error || "AI plan generation failed"
            );
        }

        plan = data.plan;

        localStorage.setItem(
            "currentPlan",
            JSON.stringify(plan)
        );

        loadWeek();

        alert(
            regenerate
                ? "New AI plan generated!"
                : "AI weekly plan generated!"
        );

    } catch (error) {

        console.error("Generation error:", error);

        alert(
            "AI plan generation failed: " +
            error.message
        );

    } finally {

        button.innerText =
            "🤖 Generate AI Weekly Plan";

        button.disabled = false;
    }
}


// ======================================================
// GENERATE NEW PLAN
// ======================================================

function generateNewPlan() {

    if (!currentUserEmail) {

        alert("User session not loaded");

        return;
    }

    generatePlan(true);
}


// ======================================================
// LOAD WEEKLY PLAN
// ======================================================

function loadWeek() {

    const grid =
        document.getElementById("weekGrid");

    grid.innerHTML = "";

    if (
        !plan ||
        Object.keys(plan).length === 0
    ) {

        grid.innerHTML =
            "<p>No AI plan generated yet.</p>";

        return;
    }

    Object.keys(plan).forEach(day => {

        const card =
            document.createElement("div");

        card.className = "day-card";

        card.innerHTML =
            `📅 ${day}`;

        card.addEventListener(
            "click",
            function () {

                showDay(day);
            }
        );

        grid.appendChild(card);
    });
}


// ======================================================
// SHOW DAY PLAN
// ======================================================

function showDay(day) {

    const data = plan[day];

    if (!data) {

        alert("Day plan not found");

        return;
    }

    let html = `

        <h3 style="color:#ff6b00;">
            ${day} Food Plan
        </h3>

    `;

    const meals = [

        {
            title: "🍳 Breakfast",
            key: "breakfast"
        },

        {
            title: "🍛 Lunch",
            key: "lunch"
        },

        {
            title: "🍎 Evening Snack",
            key: "eveningSnack"
        },

        {
            title: "🍽️ Dinner",
            key: "dinner"
        }

    ];

    meals.forEach(meal => {

        const food = data[meal.key];

        if (!food) {
            return;
        }

        html += `

            <div class="meal">

                <div class="meal-title">
                    ${meal.title}
                </div>

                <div class="food-name">
                    ${food}
                </div>

                <button
                    class="recipe-btn"
                    data-food="${encodeURIComponent(food)}"
                    data-day="${day}"
                    data-meal-type="${meal.key}"
                >

                    👨‍🍳 Make Recipe

                </button>

            </div>

        `;
    });

    const view =
        document.getElementById("dayView");

    view.innerHTML = html;

    view.style.display = "block";


    // Connect recipe buttons after HTML is created

    const recipeButtons =
        view.querySelectorAll(".recipe-btn");

    recipeButtons.forEach(button => {

        button.addEventListener(
            "click",
            function () {

                const food =
                    decodeURIComponent(
                        this.dataset.food
                    );

                const day =
                    this.dataset.day;

                const mealType =
                    this.dataset.mealType;

                generateRecipe(
                    food,
                    day,
                    mealType
                );
            }
        );
    });
}


// ======================================================
// GENERATE AI RECIPE
// ======================================================

async function generateRecipe(
    meal,
    day,
    mealType
) {

    if (!meal) {

        alert("Food item not found");

        return;
    }

    const modal =
        document.getElementById("recipeModal");

    const content =
        document.getElementById("recipeContent");

    if (!modal || !content) {

        alert(
            "Recipe modal not found in HTML"
        );

        return;
    }

    modal.style.display = "flex";

    content.innerHTML = `

        <h3 style="color:#ff6b00;">
            🤖 Creating AI Recipe...
        </h3>

        <p>
            Please wait...
        </p>

    `;

    try {

        const userData =
            getUserData();

        const response =
            await apiFetch(
                "/generate-weekly-recipe",
                {

                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        meal: meal,

                        email:
                            currentUserEmail,

                        goal:
                            userData.goal,

                        foodType:
                            userData.foodType,

                        day: day,

                        mealType: mealType
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.recipe) {

            throw new Error(
                data.error ||
                "Recipe not found"
            );
        }

        const recipe =
            data.recipe;


        const ingredients =
            Array.isArray(recipe.ingredients)
                ? recipe.ingredients
                : [];


        const steps =
            Array.isArray(recipe.steps)
                ? recipe.steps
                : [];


        const nutrition =
            recipe.nutrition || {};


        const ingredientsHTML =
            ingredients
                .map(item => `<li>${item}</li>`)
                .join("");


        const stepsHTML =
            steps
                .map(step => `<li>${step}</li>`)
                .join("");


        content.innerHTML = `

            <h2 style="color:#ff6b00;">

                🍳 ${recipe.name || meal}

            </h2>


            <h3>
                🧂 Ingredients
            </h3>


            <ul>

                ${ingredientsHTML}

            </ul>


            <h3>
                👨‍🍳 Preparation
            </h3>


            <ol>

                ${stepsHTML}

            </ol>


            <h3>
                📊 Nutrition
            </h3>


            <p>

                🔥 Calories:
                ${nutrition.calories || "N/A"}

                <br>

                💪 Protein:
                ${nutrition.protein || "N/A"}

                <br>

                🍚 Carbs:
                ${nutrition.carbs || "N/A"}

                <br>

                🥑 Fat:
                ${nutrition.fat || "N/A"}

            </p>

        `;

    } catch (error) {

        console.error(
            "Recipe error:",
            error
        );

        content.innerHTML = `

            <h3>
                ❌ Recipe generation failed
            </h3>

            <p>
                ${error.message}
            </p>

        `;
    }
}


// ======================================================
// CLOSE RECIPE MODAL
// ======================================================

function closeRecipe() {

    const modal =
        document.getElementById("recipeModal");

    if (modal) {

        modal.style.display = "none";
    }
}


// ======================================================
// REQUEST NOTIFICATIONS
// ======================================================

async function requestNotificationPermission() {

    if (!("Notification" in window)) {

        alert(
            "Notifications are not supported"
        );

        return;
    }

    const permission =
        await Notification.requestPermission();

    if (permission === "granted") {

        localStorage.setItem(
            NOTIFICATION_ENABLED_KEY,
            "true"
        );

        updateNotificationStatus();

        scheduleMealNotifications();

        alert(
            "Notifications Enabled"
        );

    } else {

        alert(
            "Please allow notifications in browser settings"
        );
    }
}


// ======================================================
// DISABLE NOTIFICATIONS
// ======================================================

function disableNotifications() {

    notificationTimers.forEach(
        timer => clearTimeout(timer)
    );

    notificationTimers = [];

    localStorage.setItem(
        NOTIFICATION_ENABLED_KEY,
        "false"
    );

    updateNotificationStatus();

    alert(
        "Notifications Disabled"
    );
}


// ======================================================
// UPDATE NOTIFICATION STATUS
// ======================================================

function updateNotificationStatus() {

    const status =
        document.getElementById(
            "notificationStatus"
        );

    const settings =
        document.getElementById(
            "notificationSettings"
        );

    if (!status || !settings) {
        return;
    }

    const enabled =
        localStorage.getItem(
            NOTIFICATION_ENABLED_KEY
        ) === "true";

    if (

        enabled &&

        "Notification" in window &&

        Notification.permission === "granted"

    ) {

        status.innerHTML =
            "✅ Notifications Enabled";

        status.style.color =
            "green";

        settings.style.display =
            "block";

    } else {

        status.innerHTML =
            "❌ Notifications Disabled";

        status.style.color =
            "red";

        settings.style.display =
            "none";
    }
}


// ======================================================
// SAVE NOTIFICATION SETTINGS
// ======================================================

function saveNotificationSettings() {

    const settings = {

        breakfast:
            document.getElementById(
                "breakfastTime"
            ).value,

        lunch:
            document.getElementById(
                "lunchTime"
            ).value,

        evening:
            document.getElementById(
                "eveningTime"
            ).value,

        dinner:
            document.getElementById(
                "dinnerTime"
            ).value
    };

    localStorage.setItem(
        SETTINGS_KEY,
        JSON.stringify(settings)
    );

    if (
        localStorage.getItem(
            NOTIFICATION_ENABLED_KEY
        ) === "true"
    ) {

        scheduleMealNotifications();
    }

    alert(
        "Notification times saved"
    );
}


// ======================================================
// LOAD NOTIFICATION SETTINGS
// ======================================================

function loadNotificationSettings() {

    const saved =
        localStorage.getItem(
            SETTINGS_KEY
        );

    if (!saved) {
        return;
    }

    const settings =
        JSON.parse(saved);

    if (settings.breakfast) {

        document.getElementById(
            "breakfastTime"
        ).value =
            settings.breakfast;
    }

    if (settings.lunch) {

        document.getElementById(
            "lunchTime"
        ).value =
            settings.lunch;
    }

    if (settings.evening) {

        document.getElementById(
            "eveningTime"
        ).value =
            settings.evening;
    }

    if (settings.dinner) {

        document.getElementById(
            "dinnerTime"
        ).value =
            settings.dinner;
    }
}


// ======================================================
// SCHEDULE NOTIFICATIONS
// ======================================================

function scheduleMealNotifications() {

    notificationTimers.forEach(
        timer => clearTimeout(timer)
    );

    notificationTimers = [];

    if (

        localStorage.getItem(
            NOTIFICATION_ENABLED_KEY
        ) !== "true"

    ) {

        return;
    }

    if (

        !("Notification" in window) ||

        Notification.permission !== "granted"

    ) {

        return;
    }

    const saved =
        localStorage.getItem(
            SETTINGS_KEY
        );

    if (!saved) {
        return;
    }

    const settings =
        JSON.parse(saved);

    const meals = [

        {
            name: "Breakfast",
            time: settings.breakfast
        },

        {
            name: "Lunch",
            time: settings.lunch
        },

        {
            name: "Evening Snack",
            time: settings.evening
        },

        {
            name: "Dinner",
            time: settings.dinner
        }

    ];

    const now =
        new Date();

    meals.forEach(meal => {

        if (!meal.time) {
            return;
        }

        const [hours, minutes] =
            meal.time
                .split(":")
                .map(Number);

        const notificationTime =
            new Date();

        notificationTime.setHours(
            hours,
            minutes,
            0,
            0
        );

        if (
            notificationTime <= now
        ) {

            notificationTime.setDate(
                notificationTime.getDate() + 1
            );
        }

        const delay =
            notificationTime.getTime()
            -
            now.getTime();

        const timer =
            setTimeout(
                function () {

                    showMealNotification(
                        meal.name
                    );

                    scheduleMealNotifications();

                },
                delay
            );

        notificationTimers.push(timer);
    });
}


// ======================================================
// SHOW NOTIFICATION
// ======================================================

function showMealNotification(mealName) {

    if (

        !("Notification" in window) ||

        Notification.permission !== "granted"

    ) {

        return;
    }

    new Notification(
        `🍽️ ${mealName} Reminder`,
        {

            body:
                "Check your NutriSmart AI weekly food plan.",

            icon:
                "./images/logo.png"
        }
    );
}


// ======================================================
// BUTTON EVENTS
// ======================================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const allowButton =
            document.getElementById(
                "allowNotificationBtn"
            );

        const disableButton =
            document.getElementById(
                "disableNotificationBtn"
            );

        const saveButton =
            document.getElementById(
                "saveNotificationBtn"
            );

        if (allowButton) {

            allowButton.addEventListener(
                "click",
                requestNotificationPermission
            );
        }

        if (disableButton) {

            disableButton.addEventListener(
                "click",
                disableNotifications
            );
        }

        if (saveButton) {

            saveButton.addEventListener(
                "click",
                saveNotificationSettings
            );
        }
    }
);


// ======================================================
// START APPLICATION
// ======================================================

window.addEventListener(
    "DOMContentLoaded",
    loadSession
);


document.addEventListener("DOMContentLoaded", () => {
    if(window.planManager) window.planManager.applyPlanPageState("meal");
});



// ==========================================
// OVERRIDDEN BY CENTRAL MANAGER
// ==========================================

async function requestNotificationPermission() {
    const planObj = window.planManager.getActivePlan();
    if (!planObj || planObj.planType !== "meal") {
        alert("Please generate a new plan or confirm the plan switch first.");
        return;
    }
    planObj.notificationsEnabled = true;
    
    const times = {
        breakfast: document.getElementById('breakfastTime')?.value || "08:00",
        lunch: document.getElementById('lunchTime')?.value || "13:00",
        evening: document.getElementById('snackTime')?.value || "17:00",
        dinner: document.getElementById('dinnerTime')?.value || "20:00"
    };
    planObj.notificationTimes = times;
    
    await window.planManager.activatePlan(planObj);
}

async function disableNotifications() {
    await window.planManager.disableActivePlan();
}

async function saveNotificationSettings() {
    await requestNotificationPermission();
}

async function scheduleMealNotifications() {
    const keys = ["currentPlan", "nutriSmartCurrentPlan", "LOSS_PLAN_KEY", "WEIGHT_GAIN_PLAN_KEY", "GYM_PLAN_KEY", "MEAL_PLAN_KEY", "BUDGET_PLAN_KEY"];
    let planData = null;
    for(let k of keys) {
        const d = localStorage.getItem(k);
        if(d) {
            try { planData = JSON.parse(d); break; } catch(e) {}
        }
    }
    
    const newPlanData = {
        notificationTimes: {
            breakfast: document.getElementById('breakfastTime')?.value || "08:00",
            lunch: document.getElementById('lunchTime')?.value || "13:00",
            evening: document.getElementById('snackTime')?.value || "17:00",
            dinner: document.getElementById('dinnerTime')?.value || "20:00"
        },
        planData: planData
    };
    
    const success = await window.planManager.requestPlanSwitch("meal", newPlanData);
    if (!success) {
        alert("The generated plan is visible, but notifications remain attached to your previously active plan.");
    }
}

// Alias for pages that use scheduleNotifications instead of scheduleMealNotifications
async function scheduleNotifications() {
    await scheduleMealNotifications();
}
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const overrideBtn = (id, html, bg, displaySettings, callback) => {
        const btn = document.getElementById(id);
        if (btn) {
            // Remove existing listeners by cloning
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            newBtn.addEventListener("click", async () => {
                const settings = document.getElementById("notificationSettings");
                if(settings) settings.style.display = displaySettings;
                if(html) newBtn.innerHTML = html;
                if(bg) newBtn.style.background = bg;
                if(callback) await callback();
            });
        }
    };
    
    overrideBtn("allowNotificationBtn", "✅ Notifications Enabled", "#28a745", "block", async () => {
        if(typeof scheduleMealNotifications === 'function') await scheduleMealNotifications();
        else if(typeof scheduleNotifications === 'function') await scheduleNotifications();
    });
    
    overrideBtn("allowBtn", "✅ Notifications Enabled", "#28a745", "block", async () => {
        if(typeof scheduleMealNotifications === 'function') await scheduleMealNotifications();
        else if(typeof scheduleNotifications === 'function') await scheduleNotifications();
    });
    
    overrideBtn("disableNotificationBtn", "🔔 Allow Notifications", "#f5a623", "none", async () => {
        if(typeof disableNotifications === 'function') await disableNotifications();
        // Reset fields
        document.querySelectorAll('input:not([id*="Time"]), select, textarea').forEach(el => el.value = "");
    });
    
    overrideBtn("disableBtn", "🔔 Allow Notifications", "#f5a623", "none", async () => {
        if(typeof disableNotifications === 'function') await disableNotifications();
        document.querySelectorAll('input:not([id*="Time"]), select, textarea').forEach(el => el.value = "");
    });
    
    overrideBtn("saveNotificationBtn", null, null, "block", async () => {
        if(typeof saveNotificationSettings === 'function') await saveNotificationSettings();
        alert("✅ Meal notification times saved successfully!");
    });
    
    overrideBtn("saveBtn", null, null, "block", async () => {
        if(typeof saveNotificationSettings === 'function') await saveNotificationSettings();
        alert("✅ Meal notification times saved successfully!");
    });
});
</script>
