<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <style>
    body,
    html {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Background video */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    /* Glass effect login form */
    .glass-form {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      padding: 4rem 3rem;
      /* More space inside */
      border-radius: 20px;
      /* Slightly larger rounded corners */
      max-width: 400px;
      /* Increased width */
      width: 95%;
      text-align: center;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.25);
      font-size: 1.2rem;
      /* Increased overall font size */
    }

    .form-control {
      margin-bottom: 1rem;
      font-size: 1.05rem;
      /* Larger input text */
      padding: 0.75rem 1rem;
    }

    .text-danger {
      font-size: 0.9rem;
    }

    .forgot-link {
      font-size: 1rem;
      cursor: pointer;
    }

    /* Button styling */
    .btn-primary {
      background-color: #ff5722;
      border-color: #ff5722;
      font-size: 1.1rem;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
    }

    .btn-primary:hover {
      background-color: #e64a19;
      border-color: #e64a19;
    }

    @media (max-width: 576px) {
      .glass-form {
        padding: 1.5rem;
        width: 95%;
      }

      .form-control {
        font-size: 1rem;
        padding: 0.5rem;
      }

      h2.mb-4 {
        font-size: 1.5rem;
      }
    }


    /* Success video overlay */
    #successVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 9999;
      display: none;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      /* full screen */
      overflow: hidden;
    }


    /* Mobile responsiveness fix */
    @media (max-width: 768px) {
      #successVideo {
        object-fit: contain;
        /* show entire video (no crop) */
        background-color: black;
        /* add black bars if needed */
      }
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

  <!-- Background video -->
  <video autoplay muted loop playsinline class="bg-video">
    <source src="./recipes_images/video.mp4" type="video/mp4">
  </video>


  <!-- Login form -->
  <div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="glass-form">
      <h2 class="mb-4">Login</h2>
      <form id="loginForm" novalidate>

        <!-- Google Auth -->
        <div id="g_id_onload" data-client_id="786266517047-fjn0bnf02v7li2ovkn2m5vrvn5fgsapl.apps.googleusercontent.com"
          data-context="signin" data-ux_mode="popup" data-callback="handleGoogleLogin" data-auto_prompt="false">
        </div>
        <!-- Web Google Button -->
        <div class="g_id_signin" id="webGoogleBtn" data-type="standard" data-shape="rectangular" data-theme="outline"
          data-text="continue_with" data-size="large" data-logo_alignment="left"
          style="display: flex; justify-content: center; margin-bottom: 15px;">
        </div>

        <!-- Native Google Button (Hidden on Web) -->
        <button type="button" id="nativeGoogleBtn" class="btn btn-outline-dark w-100"
          style="display: none; margin-bottom: 15px; font-weight: 500;">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="20" height="20"
            style="margin-right: 10px;">
          Continue with Google
        </button>
        <div style="display: flex; align-items: center; text-align: center; margin-bottom: 15px;">
          <hr style="flex: 1; border-top: 1px solid #ccc;">
          <span style="padding: 0 10px; color: #666; font-size: 14px;">OR</span>
          <hr style="flex: 1; border-top: 1px solid #ccc;">
        </div>

        <input type="email" id="email" class="form-control" placeholder="name@gmail.com" required>
        <div class="text-danger" id="emailError"></div>

        <input type="password" id="password" class="form-control" placeholder="Password" required>
        <div class="text-danger" id="passwordError"></div>

        <div class="mb-2 text-end">
          <span class="forgot-link" id="forgotPasswordLink">Forgot Password?</span>
        </div>

        <button type="submit" class="btn btn-primary w-100">Log In</button>
        <p class="mt-3 small">Don't have an account? <a href="./index.html" style="color:#e64a19;">Sign up</a></p>
      </form>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Reset Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="forgotStep1">
            <input type="email" id="resetEmail" class="form-control" placeholder="Enter your Gmail">
            <div class="text-danger mt-1" id="resetEmailError"></div>
            <button type="button" id="sendForgotOtpBtn" class="btn btn-primary w-100 mt-3">Send OTP</button>
          </div>
          <div id="forgotStep2" style="display: none;">
            <p class="text-muted small mb-2">An OTP has been sent to your email.</p>
            <input type="text" id="resetOtp" class="form-control mb-2" placeholder="6-digit OTP" maxlength="6">
            <input type="password" id="resetNewPassword" class="form-control mb-2" placeholder="New Password">
            <input type="password" id="resetConfirmPassword" class="form-control mb-2" placeholder="Confirm Password">
            <div class="text-danger mt-1" id="resetPasswordError"></div>
            <button type="button" id="resetPasswordSubmitBtn" class="btn btn-primary w-100 mt-3">Reset Password</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Success video (hidden by default) -->
  <div class="video-wrapper">
    <video id="successVideo" autoplay muted playsinline>
      <source src="./images/login.mp4" type="video/mp4">
    </video>
  </div>


  <script src="./js/api_config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const emailRegex = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,}$/;

    // Native Google Auth setup
    document.addEventListener('DOMContentLoaded', () => {
      if (window.Capacitor && window.Capacitor.isNativePlatform()) {
        try {
          Capacitor.Plugins.GoogleAuth.initialize({
            clientId: '786266517047-fjn0bnf02v7li2ovkn2m5vrvn5fgsapl.apps.googleusercontent.com',
            scopes: ['profile', 'email']
          });
        } catch (e) {
          console.error("Failed to initialize GoogleAuth", e);
        }
        document.getElementById('webGoogleBtn').style.display = 'none';
        document.getElementById('nativeGoogleBtn').style.display = 'block';

        document.getElementById('nativeGoogleBtn').addEventListener('click', async () => {
          try {
            const user = await Capacitor.Plugins.GoogleAuth.signIn();
            const res = await apiFetch('/api/auth/google', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ credential: user.authentication.idToken })
            });
            const data = await res.json();
            if (res.ok) {
              localStorage.setItem("user_name", data.name);
              if (data.access_token) {
                localStorage.setItem("access_token", data.access_token);
              }
              window.location.href = "./intro.html";
            } else {
              alert(data.detail || 'Google Login failed');
            }
          } catch (err) {
            console.error("Native Google Login error:", err);
            alert("Login Error: " + (err.message || JSON.stringify(err)));
          }
        });
      }
    });


    // Google Login Callback
    async function handleGoogleLogin(response) {
      try {
        const res = await apiFetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem("user_name", data.name);
          if (data.access_token) {
            localStorage.setItem("access_token", data.access_token);
          }
          window.location.href = "./intro.html";
        } else {
          alert(data.detail || 'Google Login failed');
        }
      } catch (err) {
        console.error("Google Login error:", err);
        alert('Server error. Try again later.');
      }
    }

    // ===== LOGIN FORM =====
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('emailError').innerText = '';
      document.getElementById('passwordError').innerText = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      let hasError = false;

      if (!emailRegex.test(email)) {
        document.getElementById('emailError').innerText = 'Please enter a valid Gmail';
        hasError = true;
      }
      if (!password) {
        document.getElementById('passwordError').innerText = 'Please enter your password';
        hasError = true;
      }
      if (hasError) return;

      try {
        const response = await apiFetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
          credentials: 'include'
        });
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem("user_name", data.name);
          if (data.access_token) {
            localStorage.setItem("access_token", data.access_token);
          }

          const successVideo = document.getElementById('successVideo');
          const form = document.querySelector('.glass-form');
          if (form) form.style.display = 'none';

          // Show video
          successVideo.style.display = 'block';
          successVideo.currentTime = 0;

          // Try playing with sound
          successVideo.muted = false;
          const playPromise = successVideo.play();

          if (playPromise !== undefined) {
            playPromise.catch(error => {
              console.warn("Autoplay with sound blocked, retrying muted...");
              successVideo.muted = true;
              successVideo.play();
            });
          }

          // When video ends, redirect to dashboard
          successVideo.onended = () => {
            window.location.href = "./intro.html";
          };

          // Fallback redirect (after 8.5s)
          setTimeout(() => {
            window.location.href = "./intro.html";
          }, 8500);

        } else {
          alert(data.detail || 'Login failed');
        }
      } catch (err) {
        console.error("Login error:", err);
        alert('Server error. Try again later.');
      }
    });

    // ===== Forgot Password Modal =====
    const forgotModal = new bootstrap.Modal(document.getElementById('forgotPasswordModal'));
    document.getElementById('forgotPasswordLink').addEventListener('click', () => forgotModal.show());

    // When the modal hides, reset it to step 1
    document.getElementById('forgotPasswordModal').addEventListener('hidden.bs.modal', function () {
      document.getElementById('resetEmail').value = '';
      document.getElementById('resetOtp').value = '';
      document.getElementById('resetNewPassword').value = '';
      document.getElementById('resetConfirmPassword').value = '';
      document.getElementById('resetEmailError').innerText = '';
      document.getElementById('resetPasswordError').innerText = '';
      document.getElementById('forgotStep1').style.display = 'block';
      document.getElementById('forgotStep2').style.display = 'none';
    });

    document.getElementById('sendForgotOtpBtn').addEventListener('click', async () => {
      const email = document.getElementById('resetEmail').value.trim();
      document.getElementById('resetEmailError').innerText = '';
      if (!emailRegex.test(email)) {
        document.getElementById('resetEmailError').innerText = 'Enter a valid Gmail';
        return;
      }

      try {
        const response = await apiFetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await response.json();

        if (response.ok) {
          alert('OTP sent! Check your email.');
          document.getElementById('forgotStep1').style.display = 'none';
          document.getElementById('forgotStep2').style.display = 'block';
        } else {
          alert(data.detail || 'Failed to send OTP.');
        }

      } catch (err) {
        console.error("Forgot password error:", err);
        alert('Server error. Try again later.');
      }
    });

    document.getElementById('resetPasswordSubmitBtn').addEventListener('click', async () => {
      const email = document.getElementById('resetEmail').value.trim();
      const otp = document.getElementById('resetOtp').value.trim();
      const newPassword = document.getElementById('resetNewPassword').value;
      const confirmPassword = document.getElementById('resetConfirmPassword').value;
      const errorDiv = document.getElementById('resetPasswordError');

      errorDiv.innerText = '';

      if (!otp || !newPassword || !confirmPassword) {
        errorDiv.innerText = 'Please fill in all fields.';
        return;
      }

      if (newPassword !== confirmPassword) {
        errorDiv.innerText = 'Passwords do not match.';
        return;
      }

      if (!passwordRegex.test(newPassword)) {
        errorDiv.innerText = 'Password must be at least 8 chars, 1 uppercase, 1 lowercase, 1 number, 1 special char.';
        return;
      }

      try {
        const response = await apiFetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp, newPassword, confirmPassword })
        });
        const data = await response.json();

        if (response.ok) {
          alert('Password reset successfully! You can now log in.');
          window.location.reload();
        } else {
          errorDiv.innerText = data.detail || 'Failed to reset password.';
        }
      } catch (err) {
        console.error("Reset error:", err);
        errorDiv.innerText = 'Server error. Try again later.';
      }
    });
  </script>
</body>

</html>
