<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">

<style>
  body, html { height: 100%; margin: 0; font-family: Arial, sans-serif; }
  .bg-video { position: fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-1; }
  .glass-form {
    background: rgba(255, 255, 255, 0.22);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    padding: 3rem;
    border-radius: 20px;
    max-width: 400px;
    width: 95%;
    text-align: center;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.25);
  }
  .form-control { margin-bottom: 1rem; font-size: 1.05rem; padding: 0.75rem 1rem; }
  .text-danger { font-size: 0.9rem; }
  .btn-primary { background-color: #ff5722; border-color: #ff5722; font-size: 1.1rem; padding: 0.75rem 1.25rem; border-radius: 8px; }
  .btn-primary:hover { background-color: #e64a19; border-color: #e64a19; }
</style>
</head>
<body>

<video autoplay muted loop playsinline class="bg-video">
  <source src="./recipes_images/video.mp4" type="video/mp4">
</video>

<div class="d-flex justify-content-center align-items-center min-vh-100">
  <div class="glass-form">
    <h2 class="mb-4">Reset Password</h2>
    <form id="resetForm" novalidate>
      <input type="password" id="newPassword" class="form-control" placeholder="New Password" required>
      <div class="text-danger" id="newPasswordError"></div>

      <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" required>
      <div class="text-danger" id="confirmPasswordError"></div>

      <button type="submit" class="btn btn-primary w-100 mt-2">Reset Password</button>
    </form>
  </div>
</div>

<script src="./js/api_config.js"></script>
<script>
const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,}$/;

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  document.getElementById('newPasswordError').innerText = '';
  document.getElementById('confirmPasswordError').innerText = '';

  const newPassword = document.getElementById('newPassword').value.trim();
  const confirmPassword = document.getElementById('confirmPassword').value.trim();
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');

  if (!token) {
      alert("Invalid or missing reset token.");
      return;
  }

  let hasError = false;
  if (!passwordRegex.test(newPassword)) {
    document.getElementById('newPasswordError').innerText = 'Password must include uppercase, lowercase, number, symbol & 8+ chars';
    hasError = true;
  }
  if (newPassword !== confirmPassword) {
    document.getElementById('confirmPasswordError').innerText = 'Passwords do not match';
    hasError = true;
  }
  if (hasError) return;

  const btn = e.target.querySelector('button');
  btn.disabled = true;

  try {
    const response = await apiFetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword, confirmPassword })
    });
    
    const data = await response.json();
    if (response.ok) {
      alert('Password reset successful! You can now log in.');
      window.location.href = "./login.html";
    } else {
      alert(data.detail || 'Password reset failed');
    }
  } catch (err) {
    console.error(err);
    alert('Server error. Try again later.');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
